<HTML>
	<HEAD>
				<!-- Google Tag Manager -->
		<script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
		new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
		j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
		'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
		})(window,document,'script','dataLayer','GTM-5HKW94WH');</script>
		<!-- End Google Tag Manager -->
		<style>
			.clockBorder {
				width: 180px;
				height: 180px;
				border-radius: 100px;
				border-width: 4px;
				border-color: gray;
				border-style: solid;
				position: relative;
			}
			.armVertex {
				width: 15px;
				height: 15px;
				border-radius: 10px;
				background-color: black;
				position: absolute;
				top: 83px;
				left: 83px;
			}
			.numberText {
				position: absolute;
				color: rgb(0, 255, 8);
				font-weight: bold;
				font-size: 24px;
			}
			.twelve {
				top: 5px;
				left: 77px;
			}
			.three {
				top: 77px;
				left: 167px;
			}
			.six {
				top: 155px;
				left: 84px;
			}
			.nine {
				top: 77px;
				left: 5px;
			}
			.hourArm {
				width: 3px;
				height: 50px;
				position:absolute;
				top: 40px;
				left: 90px;
				background-color: black;
				transform-origin: bottom;
				transform: rotate(0deg);
			}
			.minuteArm {
				width: 2px;
				height: 70px;
				position:absolute;
				top: 20px;
				left: 90px;
				background-color: black;
				transform-origin: bottom;
				transform: rotate(0deg);
			}
			.secondArm {
				width: 1px;
				height: 85px;
				position:absolute;
				top: 5px;
				left: 90px;
				background-color: black;
				transform-origin: bottom;
				transform: rotate(0deg);
			}
			.digitalReadout {
				width: 180px;
				text-align: center;
				margin-top: 10px;
				font-family: monospace;
				font-size: 20px;
				font-weight: bold;
				color: black;
			}
		</style>
		<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	</HEAD>
	<BODY>
				<!-- Google Tag Manager (noscript) -->
		<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5HKW94WH"
		height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
		<!-- End Google Tag Manager (noscript) -->
		<div class="clockBorder">
			<div class="armVertex"></div>
			<div class="hourArm"></div>
			<div class="minuteArm"></div>
			<div class="secondArm"></div>
			<div class="numberText twelve">12</div>	
			<div class="numberText three">3</div>
			<div class="numberText six">6</div>
			<div class="numberText nine">9</div>
		</div>
		<div class="digitalReadout" id="digitalTime"></div>

		<script>
			function tick() {
				var time = new Date();
				var hours = time.getHours();
				var minutes = time.getMinutes();
				var seconds = time.getSeconds();

				$('.secondArm').css('transform', 'rotate(' + (360 * seconds / 60) + 'deg)');
				$('.minuteArm').css('transform', 'rotate(' + (360 * minutes / 60) + 'deg)');
				$('.hourArm').css('transform', 'rotate(' + (360 * hours / 12) + 'deg)');

				var displayHours = String(hours).padStart(2, '0');
				var displayMinutes = String(minutes).padStart(2, '0');
				var displaySeconds = String(seconds).padStart(2, '0');
				$('#digitalTime').text(displayHours + ':' + displayMinutes + ':' + displaySeconds);
			}
			// Update arm angles every second (1 second).
			setInterval(tick, 1000);
			tick();
		</script>
	</BODY>
</HTML>
